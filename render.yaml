services:
  - type: web
    name: steam-app
    env: native
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan storage:link && php artisan config:cache && php artisan route:cache && php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: 4000
      - key: DB_DATABASE
        value: sys
      - key: DB_USERNAME
        value: 3CkqCZNVEGSTaVc.root
      - key: DB_PASSWORD
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false